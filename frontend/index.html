<!doctype html>
<html>
<head><meta charset="utf-8"><title>SentinelOps SOC Console</title></head>
<body>
  <h1>SentinelOps SOC Console (MVP)</h1>
  <pre id="summary">Loading summary...</pre>
  <pre id="telemetry">Loading telemetry...</pre>
  <script>
    const headers = {"X-API-Token":"change-me","X-User":"secops","X-Role":"security_analyst"};
    async function load() {
      const s = await fetch('http://127.0.0.1:8000/api/v1/summary',{headers}).then(r=>r.json());
      document.getElementById('summary').textContent = JSON.stringify(s,null,2);
      const t = await fetch('http://127.0.0.1:8000/api/v1/telemetry',{headers}).then(r=>r.json());
      document.getElementById('telemetry').textContent = JSON.stringify(t,null,2);
    }
    load();
    const ws = new WebSocket('ws://127.0.0.1:8000/ws/live');
    ws.onmessage = (event)=>{
      const data = JSON.parse(event.data);
      document.getElementById('summary').textContent = JSON.stringify(data.summary,null,2);
    };
  </script>
</body>
</html>
